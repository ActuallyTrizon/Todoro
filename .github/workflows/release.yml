name: Release CI

on:
  push:
    branches: [ "main" ]
    paths-ignore:
      - '**/*.md'
  pull_request:
    branches: [ "main" ]
    paths-ignore:
      - '**/*.md'
  workflow_dispatch:
    inputs:
      publish_after_build:
        description: 'Do you want to run publish.yml after?'
        required: true
        type: boolean
        default: false
      tag_name:
        description: 'Release Tag (Required)'
        required: false
        type: string

jobs:
  build:
    name: Build Release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools platforms;android-36 build-tools;36.0.0'
          
      - name: Grant Permission
        run: chmod +x gradlew
        
      - name: Sign Release APK
        env:
          KEYSTORE_PATH: ${{ github.workspace }}/keystore.jks
          STORE_PASS: ${{ secrets.STORE_PASS }}
          SIGN_ALIAS: ${{ secrets.SIGN_ALIAS }}
          KEY_PASS: ${{ secrets.KEY_PASS }}
        run: |
          echo "${{ secrets.KEYSTORE_BASE64}}"

      - name: Build APK
        run: ./gradlew assembleRelease
          
      - name: Upload Release APK
        uses: actions/upload-artifact@v7
        with:
          name: Release
          path: app/build/outputs/apk/release/*.apk

  trigger-publish:
    name: Trigger Publish Workflow
    needs: build
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch' && github.event.inputs.publish_after_build == 'true'
    permissions:
      actions: write
      contents: read
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Validate Tag Name
        run: |
          TAG="${{ github.event.inputs.tag_name }}"
          if [ -z "$TAG" ]; then
            echo "Error: Tag name is required when publishing is enabled."
            exit 1
          fi
          echo "Tag name is valid: $TAG"

      - name: Trigger Publish
        run: |
          TAG="${{ github.event.inputs.tag_name }}"
          echo "Triggering publish.yml for release with tag $TAG..."
          gh workflow run publish.yml \
            -f workflow_type=release \
            -f tag_name="$TAG"